[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-ml"
version = "1.0.0"
description = "Reproducible music ranking, evaluation, and model serving"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2.2,<3",
  "scikit-learn>=1.6,<2", "pydantic>=2.10,<3", "prometheus-client>=0.21,<1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "pip-audit>=2.8,<3"]

[project.scripts]
music-ml = "music_ml.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov-config=.github/coverage.ini"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
