name: Model validation
on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  train-evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: pip install uv==0.11.7
      - run: uv sync --frozen
      - run: uv run python -m music_ml.cli generate
      - run: uv run python -m music_ml.cli validate
      - run: uv run python -m music_ml.cli train
      - name: Write model report to job summary
        if: always()
        run: |
          if [ -f artifacts/metrics.json ]; then
            echo '### Held-out model evaluation (synthetic data)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/metrics.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: model-candidate-${{ github.sha }}
          path: artifacts/
          retention-days: 30
          if-no-files-found: error
